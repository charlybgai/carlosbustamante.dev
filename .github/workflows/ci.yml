name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.15.2
          terraform_wrapper: false
      - run: terraform -chdir=infra fmt -check -recursive
      - run: terraform -chdir=infra init -backend=false -lockfile=readonly -input=false
      - run: terraform -chdir=infra validate
      - run: terraform -chdir=infra/bootstrap init -backend=false -lockfile=readonly -input=false
      - run: terraform -chdir=infra/bootstrap validate

  lambda:
    name: Lambda
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m py_compile functions/send_email/lambda_function.py
      - run: python -m unittest discover -s functions/send_email

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: node --check sites/root/assets/js/script.js
      - name: Check compiled CSS matches SCSS
        run: |
          css_dir=$(mktemp -d)
          trap 'rm -rf "$css_dir"' EXIT
          npx --yes sass@1.105.0 sites/root/assets/scss/main.scss "$css_dir/main.css"
          diff -u sites/root/assets/css/main.css "$css_dir/main.css"
      - run: npx --yes html-validate@11.16.1 --rule 'no-inline-style:off' sites/root/index.html sites/root/es/index.html sites/root/404.html
      - run: ./deploy.sh root --check-only
      - run: python -m unittest discover -s tools -p 'test_*.py'

  shell:
    name: Shell
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install shellcheck-py==0.10.0.1
      - run: shellcheck deploy.sh cv/build.sh tools/build-bootstrap.sh
