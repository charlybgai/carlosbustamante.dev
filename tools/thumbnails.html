<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Project card thumbnails. Rendered to WebP by tools/build-thumbnails.py: one <template> per
     project, selected with ?p=<id>. Everything is inline SVG, so renders are identical anywhere. -->
<style>
  html, body { margin: 0; width: 1200px; height: 750px; overflow: hidden; background: #0F172A; }
  .frame { position: relative; width: 1200px; height: 750px; overflow: hidden;
    background:
      radial-gradient(560px 420px at 20% 10%, rgba(16,185,129,.26), transparent 70%),
      radial-gradient(640px 460px at 90% 100%, rgba(59,130,246,.30), transparent 70%),
      #0F172A; }
  .grid { position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(148,163,184,.07) 2px, transparent 2px),
      linear-gradient(90deg, rgba(148,163,184,.07) 2px, transparent 2px);
    background-size: 60px 60px;
    mask-image: radial-gradient(ellipse 70% 70% at 55% 45%, #000 25%, transparent 100%); }
  svg.art { position: absolute; inset: 0; }
</style>
</head>
<body>
<div class="frame">
  <div class="grid"></div>
  <svg class="art" id="art" viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg"></svg>
</div>

<!-- Shared palette (site tokens): bg #0F172A, emerald #10B981, blue #3B82F6, slate #94A3B8,
     text #F8FAFC, danger #F87171. Motifs sit around (620, 330) so the label chip corner
     (bottom left) stays quiet; strokes are thick enough to survive a 300 px wide card. -->
<template id="defs"><svg>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10B981"/><stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22305A"/><stop offset="1" stop-color="#151E36"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="halo" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="40"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#94A3B8"/>
    </marker>
  </defs>
</svg></template>

  <ellipse cx="620" cy="360" rx="420" ry="200" fill="#F87171" opacity=".10" filter="url(#halo)"/>
  <ellipse cx="620" cy="300" rx="380" ry="180" fill="url(#brand)" opacity=".12" filter="url(#halo)"/>

    </g>
  </g>
  <!-- seismic trace across -->

        fill="none" stroke="url(#brand)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- countdown ring -->

    <circle r="78" fill="url(#panel)" stroke="rgba(148,163,184,.4)" stroke-width="12"/>
    <circle r="78" fill="none" stroke="#10B981" stroke-width="12" stroke-linecap="round"
            stroke-dasharray="360 490" transform="rotate(-90)" filter="url(#glow)"/>
    <path d="M0 -38 V0 L26 18" fill="none" stroke="#F8FAFC" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg></template>

<script>
  const name = new URLSearchParams(location.search).get("p");
  const part = id => document.getElementById(id).content.querySelector("svg").innerHTML;
  const art = document.getElementById("art");
  art.innerHTML = part("defs") + `<g id="motif">${part(name)}</g>`;

  // Deterministic pseudo-random numbers, so every render is identical
  let seed = 11;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

  if (name === "fraud") {
    const nodes = [];
    for (let i = 0; i < 60 && nodes.length < 30; i++) {
      const a = rnd() * Math.PI * 2, r = 300 + rnd() * 280;
      const x = 620 + Math.cos(a) * r * 1.2, y = 320 + Math.sin(a) * r * 0.6;
      if (x < 60 || x > 1140 || y < 50 || y > 690) continue;
      if (x < 430 && y > 540) continue; // keep the label corner quiet
      nodes.push([x, y]);
    }
    const flagged = new Set([2, 9, 17]);
    let g = "";
    nodes.forEach(([x, y], i) => nodes.forEach(([x2, y2], j) => {
      if (j > i && Math.hypot(x - x2, y - y2) < 230)
        g += `<line x1="${x}" y1="${y}" x2="${x2}" y2="${y2}" stroke="rgba(148,163,184,.28)" stroke-width="4"/>`;
    }));
    nodes.forEach(([x, y], i) => {
      if (i % 3 === 0 || flagged.has(i))
        g += `<line x1="${x}" y1="${y}" x2="620" y2="320" stroke="${flagged.has(i) ? "rgba(248,113,113,.7)" : "rgba(16,185,129,.35)"}" stroke-width="5"/>`;
    });
    nodes.forEach(([x, y], i) => {
      g += flagged.has(i)
        ? `<circle cx="${x}" cy="${y}" r="36" fill="none" stroke="#F87171" stroke-width="5" opacity=".55"/><circle cx="${x}" cy="${y}" r="18" fill="#F87171" filter="url(#glow)"/>`
        : `<circle cx="${x}" cy="${y}" r="${10 + (i % 3) * 3}" fill="${i % 3 === 0 ? "#3B82F6" : "#10B981"}"/>`;
    });
    document.getElementById("net").innerHTML = g;
  }

  if (name === "qr") {
    // A decorative QR-like pattern (not a scannable code): three finder squares + random modules
    const n = 21, m = 11, q = [];
    const finder = (x, y) => q.push(
      `<rect x="${x * m}" y="${y * m}" width="${7 * m}" height="${7 * m}" rx="6" fill="none" stroke="#F8FAFC" stroke-width="${m}" transform="translate(${m / 2} ${m / 2}) scale(${(7 * m - m) / (7 * m)})"/>`,
      `<rect x="${(x + 2) * m}" y="${(y + 2) * m}" width="${3 * m}" height="${3 * m}" rx="3" fill="#F8FAFC"/>`);
    const inFinder = (x, y) => (x < 8 && y < 8) || (x > n - 9 && y < 8) || (x < 8 && y > n - 9);
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++)
      if (!inFinder(x, y) && rnd() < 0.5) q.push(`<rect x="${x * m}" y="${y * m}" width="${m}" height="${m}" fill="#F8FAFC"/>`);
    finder(0, 0); finder(n - 7, 0); finder(0, n - 7);
    document.getElementById("qrcode").innerHTML =
      `<rect x="-14" y="-14" width="${n * m + 28}" height="${n * m + 28}" rx="16" fill="#0F172A" stroke="#10B981" stroke-width="5"/>` + q.join("");
  }

  // Fit the motif into the band both crops keep: the card shows the full 16:10 frame (with its
  // label chip bottom left), the popup a centered ~21:9 strip (about y 146-603). Center it at
  // y 375 and shrink it to 420 px tall if needed. Halos are ignored when measuring; the fraud
  // network is a full-bleed background, so it is left as drawn.
  if (name !== "fraud") {
    const motif = document.getElementById("motif");
    const halos = [...motif.querySelectorAll('[filter="url(#halo)"]')];
    halos.forEach(h => h.style.display = "none");
    const bb = motif.getBBox();
    halos.forEach(h => h.style.display = "");
    const s = Math.min(1, 420 / bb.height, 1040 / bb.width);
    const cx = bb.x + bb.width / 2, cy = bb.y + bb.height / 2;
    motif.setAttribute("transform", `translate(${cx} 375) scale(${s}) translate(${-cx} ${-cy})`);
  }
</script>
</body>
</html>
